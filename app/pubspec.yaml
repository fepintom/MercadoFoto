name: okventa_app
description: "Okventa: marketplace con IA para publicación de productos desde imágenes"
publish_to: 'none'

version: 1.0.0+11

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # Core app
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.2.2

  http: 0.13.6
  local_auth: ^2.3.0

  # Geolocalización
  geolocator: ^12.0.0

  # Mapa (OpenStreetMap, sin API key)
  flutter_map: ^4.0.0
  latlong2: ^0.8.2

  # Compartir / deep-links (WhatsApp, etc.)
  url_launcher: ^6.3.0

  # Cache de imágenes en disco
  cached_network_image: ^3.3.1

  # Notificaciones push
  firebase_messaging: ^15.0.0

  # Etiqueta de envío con doble QR
  qr_flutter: ^4.1.0      # genera los QR client-side, sin internet
  printing: ^5.13.0       # imprimir / compartir la etiqueta como PDF
  app_links: ^6.3.0       # deep links okventa:// (QR escaneado con la cámara)

  # Verificación antifraude de embalaje (sellos de seguridad + video con rejilla)
  camera: ^0.10.6         # cámara en vivo con overlay de rejilla y grabación de video
  video_thumbnail: ^0.5.3 # extrae fotogramas clave del video grabado (no se sube el video completo)
  path_provider: ^2.1.3   # carpeta temporal para el video y los fotogramas antes de subirlos

  # Catálogo de tienda: elegir el PDF del catálogo desde el dispositivo
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/banner1.jpg
    - assets/images/banner2.jpg
    - assets/images/banner3.jpg
    - assets/images/home.png
    - assets/images/okventin.png
    - assets/images/okventin_vender.png
    - assets/images/okventin_chat.png
    - assets/images/okventin_servicios.png
    - assets/images/okventin_compra.png
    - assets/images/mensajes.png
    - assets/images/chekin.png
    - assets/images/carrito.png
    - assets/images/sellos/sello_seguridad_1.png
    - assets/images/sellos/sello_seguridad_2.png
    - assets/images/sellos/sello_seguridad_3.png
    - assets/images/sellos/sello_seguridad_4.png
